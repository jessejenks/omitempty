name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test
      - run: deno task bundle
      - run: sha256sum omitempty.cjs > omitempty.cjs.sha256
      - run: gh release create "$GITHUB_REF_NAME" omitempty.cjs omitempty.cjs.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
